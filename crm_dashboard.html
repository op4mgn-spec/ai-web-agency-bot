<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Web Agency | CRM & A/B Dashboard</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        .logo { font-size: 22px; font-weight: bold; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        
        .filter-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; background: #182234; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); }
        .filter-btn { background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .filter-btn:hover { border-color: var(--primary); color: var(--text-main); }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: 600; }

        .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--card-bg); padding: 18px; border-radius: 10px; border: 1px solid var(--border); }
        .stat-card h4 { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
        .stat-card .value { font-size: 24px; font-weight: bold; }
        
        .kanban { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; overflow-x: auto; }
        .column { background: #182234; padding: 14px; border-radius: 12px; border: 1px solid var(--border); min-height: 500px; }
        .column-header { font-size: 14px; font-weight: bold; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .badge { background: var(--border); padding: 2px 8px; border-radius: 12px; font-size: 11px; }
        
        .lead-card { background: var(--card-bg); padding: 14px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 12px; cursor: pointer; transition: 0.2s; }
        .lead-card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .lead-name { font-weight: bold; font-size: 14px; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .lead-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        .variant-tag { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .incomplete-warning { color: var(--warning); font-size: 11px; margin-top: 5px; font-weight: 500; }

        /* Modal for Chat History */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--card-bg); width: 90%; max-width: 680px; height: 85vh; border-radius: 12px; display: flex; flex-direction: column; border: 1px solid var(--border); }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .chat-msg { max-width: 85%; padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.4; }
        .chat-msg.user { align-self: flex-start; background: #334155; color: white; }
        .chat-msg.bot { align-self: flex-end; background: var(--primary); color: white; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div class="logo">⚡️ AI Web Agency CRM & A/B Center</div>
        <div style="display: flex; gap: 10px;">
            <button onclick="loadCRM()" style="background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500;">🔄 Обновить данные</button>
            <a href="/api/export_crm" style="background: var(--success); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center;">📥 Экспорт в CSV</a>
        </div>
    </header>

    <div class="filter-bar">
        <span style="font-size: 13px; font-weight: 600; color: var(--text-muted);">ИИ-Продавцы:</span>
        <button class="filter-btn active" id="btn-ALL" onclick="setPersonaFilter('ALL')">🌐 Все варианты (Показать всех)</button>
        <button class="filter-btn" id="btn-A" onclick="setPersonaFilter('Variant A (Консультант)')">💬 Variant A (Консультант)</button>
        <button class="filter-btn" id="btn-B" onclick="setPersonaFilter('Variant B (Прямые Продажи)')">⚡️ Variant B (Прямые Продажи)</button>
        <button class="filter-btn" id="btn-C" onclick="setPersonaFilter('Variant C (Демо-Специалист)')">🎨 Variant C (Демо-Специалист)</button>
        <button class="filter-btn" id="btn-D" onclick="setPersonaFilter('Variant D (Архитектор Решений)')">🏗 Variant D (Архитектор Решений)</button>
    </div>

    <div class="stats-bar" id="statsBar">
        <!-- Loaded via JS -->
    </div>

    <div class="kanban">
        <div class="column">
            <div class="column-header">🆕 Новые <span class="badge" id="count-NEW">0</span></div>
            <div id="col-NEW"></div>
        </div>
        <div class="column">
            <div class="column-header" style="color: var(--warning);">⚠️ Бросили бриф / Дожим <span class="badge" id="count-INCOMPLETE_BRIEF">0</span></div>
            <div id="col-INCOMPLETE_BRIEF"></div>
        </div>
        <div class="column">
            <div class="column-header" style="color: var(--danger);">🛠 Отказ / Доработка админом <span class="badge" id="count-REJECTED">0</span></div>
            <div id="col-REJECTED"></div>
        </div>
        <div class="column">
            <div class="column-header" style="color: #f87171;">📉 Неудачная сделка <span class="badge" id="count-LOST">0</span></div>
            <div id="col-LOST"></div>
        </div>
        <div class="column">
            <div class="column-header" style="color: var(--primary);">💰 Оплачены / Бриф <span class="badge" id="count-WAITING_PAYMENT">0</span></div>
            <div id="col-WAITING_PAYMENT"></div>
        </div>
        <div class="column">
            <div class="column-header" style="color: var(--success);">🔨 Сгенерированы <span class="badge" id="count-GENERATED">0</span></div>
            <div id="col-GENERATED"></div>
        </div>
        <div class="column">
            <div class="column-header">✅ Доставлены <span class="badge" id="count-DELIVERED">0</span></div>
            <div id="col-DELIVERED"></div>
        </div>
    </div>

    <!-- Modal Chat Viewer -->
    <div class="modal" id="chatModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">История диалога с клиентом</h3>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="chat-box" id="chatBox"></div>
        </div>
    </div>

    <script>
        let rawCRMData = null;
        let selectedPersona = 'ALL';

        async function loadCRM() {
            try {
                const res = await fetch('/api/crm_data');
                rawCRMData = await res.json();
                applyPersonaFilter();
            } catch (err) {
                console.error("Error loading CRM data:", err);
            }
        }

        function setPersonaFilter(persona) {
            selectedPersona = persona;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            
            if (persona === 'ALL') document.getElementById('btn-ALL').classList.add('active');
            else if (persona === 'Variant A (Консультант)') document.getElementById('btn-A').classList.add('active');
            else if (persona === 'Variant B (Прямые Продажи)') document.getElementById('btn-B').classList.add('active');
            else if (persona === 'Variant C (Демо-Специалист)') document.getElementById('btn-C').classList.add('active');
            else if (persona === 'Variant D (Архитектор Решений)') document.getElementById('btn-D').classList.add('active');

            applyPersonaFilter();
        }

        function applyPersonaFilter() {
            if (!rawCRMData) return;

            let leads = rawCRMData.leads;
            let abStats = rawCRMData.ab_stats;

            if (selectedPersona !== 'ALL') {
                leads = rawCRMData.leads.filter(l => l.bot_variant === selectedPersona);
                abStats = rawCRMData.ab_stats.filter(s => s.bot_variant === selectedPersona);
            }

            renderStats(abStats);
            renderKanban(leads);
        }

        function renderStats(abStats) {
            const statsBar = document.getElementById('statsBar');
            statsBar.innerHTML = abStats.map(s => `
                <div class="stat-card">
                    <h4>${s.bot_variant || 'Основной'}</h4>
                    <div class="value">${s.total_leads} <span style="font-size: 13px; color: var(--text-muted);">лидов</span></div>
                    <div style="font-size: 12px; color: var(--text-muted); margin-top: 5px;">
                        Брифы: ${s.briefs_count} | Продажи: <strong style="color: var(--success);">${s.sales_count}</strong>
                    </div>
                </div>
            `).join('');
        }

        function formatChatText(text) {
            if (!text) return '';
            let escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            return escaped.replace(/\n/g, "<br>");
        }

        function renderKanban(leads) {
            const cols = ['NEW', 'INCOMPLETE_BRIEF', 'REJECTED', 'LOST', 'WAITING_PAYMENT', 'GENERATED', 'DELIVERED'];
            cols.forEach(c => {
                const colEl = document.getElementById(`col-${c}`);
                if (colEl) colEl.innerHTML = '';
                const badge = document.getElementById(`count-${c}`);
                if (badge) badge.innerText = '0';
            });

            const counts = {};
            leads.forEach(l => {
                let status = l.status || 'NEW';
                if (['BRIEFING', 'INCOMPLETE_BRIEF', 'BRIEF_RECOVERY_SENT', 'INCOMPLETE_RECOVERED_NOTIFIED'].includes(status)) {
                    status = 'INCOMPLETE_BRIEF';
                } else if (['REJECTED', 'OBJECTION', 'NEED_ADMIN'].includes(status)) {
                    status = 'REJECTED';
                } else if (['LOST', 'FAILED', 'CANCELLED'].includes(status)) {
                    status = 'LOST';
                } else if (['WAITING_PAYMENT'].includes(status)) {
                    status = 'WAITING_PAYMENT';
                } else if (['PAID', 'GENERATED'].includes(status)) {
                    status = 'GENERATED';
                } else if (['DELIVERED'].includes(status)) {
                    status = 'DELIVERED';
                } else if (!cols.includes(status)) {
                    status = 'NEW';
                }

                counts[status] = (counts[status] || 0) + 1;

                const cardHtml = `
                    <div class="lead-card" onclick="openChat(${l.telegram_id}, '${(l.full_name || 'Клиент').replace(/'/g, "")}')">
                        <div class="lead-name">
                            <span>${l.full_name || 'Клиент'}</span>
                            <span style="font-size: 11px; color: var(--text-muted);">@${l.username || 'id'+l.telegram_id}</span>
                        </div>
                        <div class="lead-meta">
                            <span class="variant-tag">${l.bot_variant}</span>
                        </div>
                        ${l.brief_step > 0 && l.brief_step < 7 ? `<div class="incomplete-warning">⚠️ Бросил бриф на шаге ${l.brief_step}/7</div>` : ''}
                        ${l.brief_data && l.brief_data !== '{}' ? `<div style="font-size: 11px; color: var(--success); margin-top: 4px;">✓ Бриф заполнен</div>` : ''}
                        ${l.feedback ? `<div style="font-size: 11px; color: ${status === 'LOST' ? '#f87171' : 'var(--warning)'}; margin-top: 4px; font-weight: 500;">💬 ${l.feedback}</div>` : ''}
                    </div>
                `;

                const colEl = document.getElementById(`col-${status}`);
                if (colEl) colEl.innerHTML += cardHtml;
            });

            cols.forEach(c => {
                const badge = document.getElementById(`count-${c}`);
                if (badge) badge.innerText = counts[c] || 0;
            });
        }

        async function openChat(telegramId, name) {
            document.getElementById('modalTitle').innerText = `Диалог с ${name}`;
            const modal = document.getElementById('chatModal');
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = '<div style="color: var(--text-muted); text-align: center;">Загрузка диалога...</div>';
            modal.style.display = 'flex';

            try {
                const res = await fetch(`/api/chat_history?telegram_id=${telegramId}`);
                const messages = await res.json();
                if (messages.length === 0) {
                    chatBox.innerHTML = '<div style="color: var(--text-muted); text-align: center;">Диалог пуст</div>';
                } else {
                    chatBox.innerHTML = messages.map(m => `
                        <div class="chat-msg ${m.sender.toLowerCase()}">
                            <div style="font-size: 11px; opacity: 0.7; margin-bottom: 2px;">${m.sender === 'USER' ? 'Клиент' : 'ИИ-Бот ('+(m.bot_variant || 'Ответ')+')'}</div>
                            <div>${formatChatText(m.text)}</div>
                        </div>
                    `).join('');
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            } catch (err) {
                chatBox.innerHTML = 'Ошибка загрузки диалога';
            }
        }

        function closeModal() {
            document.getElementById('chatModal').style.display = 'none';
        }

        loadCRM();
        setInterval(loadCRM, 10000);
    </script>
</body>
</html>
